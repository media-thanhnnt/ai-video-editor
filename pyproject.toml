[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-editor"
version = "2.1.0"
description = "AI Video Editor — Phase 2.1 manual-asset agent foundation atop Core 1.10.3"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0,<13", "numpy>=1.26,<3", "opencv-python>=4.8,<5"]

[project.scripts]
ai-video-editor = "ai_video_editor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
